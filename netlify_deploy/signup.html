<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Qonnect GeoAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fbf9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(8,28,21,0.08); text-align: center; max-width: 400px; width: 100%; }
        h2 { color: #1b4332; font-family: 'Space Grotesk', sans-serif; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .btn { background-color: #2d6a4f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'Space Grotesk', sans-serif; transition: background 0.3s; }
        .btn:hover { background-color: #1b4332; }
        .back-link { display: block; margin-top: 20px; color: #74c69d; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        #message { margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Join Qonnect Spatial</h2>
        <p style="color: #666; font-size: 0.9rem;">Create an account to access the live platform.</p>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password (min 6 chars)" required>
        <button class="btn" onclick="handleSignup()">Create Account</button>
        <div id="message"></div>
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>
    <script>
        const supabase = window.supabase.createClient('https://toujtawzftajiuoxblaj.supabase.co', '$filePath = "C:\qonnect-geoai-platform\netlify_deploy\traceability.html"');
        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.style.color = "black";
            msg.innerText = "Creating account...";
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { msg.style.color = "red"; msg.innerText = "Error: " + error.message; }
            else { msg.style.color = "green"; msg.innerText = "✅ Success! Check your email to confirm."; }
        }
    </script>
</body>
</html>
