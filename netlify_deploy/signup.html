<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Qonnect GeoAI</title>
    <!-- Netlify Identity Widget -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f9f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .signup-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #1b4332; }
        p { color: #555; margin-bottom: 20px; }
        .btn { background-color: #2d6a4f; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn:hover { background-color: #1b4332; }
        .back-link { display: block; margin-top: 20px; color: #2d6a4f; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Join Qonnect GeoAI</h1>
        <p>Create an account to access the live geospatial map, policy briefs, and marketplace links.</p>
        
        <!-- Netlify Identity Widget Button -->
        <button class="btn" data-netlify-identity-button>Create Account / Sign Up</button>
        
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <script>
        // Automatically open the signup modal when the page loads
        window.netlifyIdentity = window.netlifyIdentity || {};
        window.addEventListener('load', function() {
            if (window.netlifyIdentity) {
                window.netlifyIdentity.open('signup');
            }
        });
    </script>
</body>
</html>
